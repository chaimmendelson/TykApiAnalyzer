[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tyk-analyzer"
version = "0.1.0"
description = "Read-only analytics dashboard for Tyk API definitions stored in MongoDB"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40",
    "plotly",
    "pymongo",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]  # "." lets tests import `tests.conftest` under a bare `pytest` too

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["C408", "BLE001"]
