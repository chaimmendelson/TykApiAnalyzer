# Reusable test job set: called by ci.yml (every push and pull request) and by release.yml (before publishing).
name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml

      - name: Install the locked dependencies and the package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . pytest ruff

      - name: Lint
        run: ruff check src tests

      # No MongoDB and no browser here: the integration and UI tests skip themselves
      # unless MONGO_URI / UI_URL are set.
      - name: Unit tests
        run: pytest -q -ra

  docker-smoke:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image (not published)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: tyk-api-analyzer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Runs as a non-root user
        run: |
          uid=$(docker run --rm --entrypoint id tyk-api-analyzer:ci -u)
          echo "container user id: $uid"
          test "$uid" != "0"

      - name: Starts and reports healthy
        run: |
          # A dead MongoDB address is fine: the dashboard shows its error banner and stays up.
          docker run -d --name dashboard -p 8501:8501 -e MONGO_URI=mongodb://127.0.0.1:1 tyk-api-analyzer:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health | grep -q ok; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "dashboard did not become healthy" >&2
          docker logs dashboard >&2
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs dashboard || true
